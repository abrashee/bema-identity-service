server.port=8084
spring.application.name=identity-service

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

user-service.base-url=${USER_SERVICE_URL}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.root=INFO
logging.level.org.springframework.security=WARN


# Production
spring.jpa.open-in-view=false

management.tracing.enabled=false

# Structured JSON logging
logging.structured.format.console=logstash

# Redis-backed access-token revocation
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Optional one-time administrator bootstrap
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}

# Redis-backed account brute-force protection
security.brute-force.max-failures=${BRUTE_FORCE_MAX_FAILURES:5}
security.brute-force.failure-window-seconds=${BRUTE_FORCE_FAILURE_WINDOW_SECONDS:900}
security.brute-force.lock-seconds=${BRUTE_FORCE_LOCK_SECONDS:900}
